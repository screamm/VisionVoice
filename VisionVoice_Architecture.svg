<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8e3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9a825;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">VisionVoice System Architecture</text>
  
  <!-- User Device Section -->
  <rect x="50" y="60" width="800" height="150" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4285f4">👤 USER'S DEVICE (Browser PWA)</text>
  
  <!-- Device components -->
  <rect x="80" y="100" width="120" height="60" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">📷 Camera</text>
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">WebRTC</text>
  
  <rect x="220" y="100" width="120" height="60" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="280" y="125" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">🎤 Microphone</text>
  <text x="280" y="145" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">WebRTC</text>
  
  <rect x="360" y="100" width="120" height="60" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="420" y="125" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">🔊 Speaker</text>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Audio Output</text>
  
  <!-- Frontend box -->
  <rect x="520" y="95" width="310" height="70" rx="8" fill="#1a73e8" filter="url(#shadow)"/>
  <text x="675" y="120" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Next.js PWA Frontend</text>
  <text x="675" y="140" font-family="Arial, sans-serif" font-size="10" fill="#b3d4fc" text-anchor="middle">Camera capture + Audio streaming + UI</text>
  <text x="675" y="155" font-family="Arial, sans-serif" font-size="10" fill="#b3d4fc" text-anchor="middle">Accessibility Controls</text>
  
  <!-- Arrows from devices to frontend -->
  <path d="M200 130 L510 130" stroke="#4285f4" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M340 130 L510 130" stroke="#4285f4" stroke-width="2" fill="none"/>
  <path d="M480 130 L510 130" stroke="#4285f4" stroke-width="2" fill="none"/>
  
  <!-- Connection labels -->
  <rect x="380" y="185" width="140" height="25" rx="4" fill="#5f6368"/>
  <text x="450" y="202" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">WebSocket + HTTPS</text>
  
  <!-- Arrow down -->
  <path d="M450 170 L450 230" stroke="#5f6368" stroke-width="3" fill="none"/>
  <polygon points="450,240 445,230 455,230" fill="#5f6368"/>
  
  <!-- Google Cloud Section -->
  <rect x="50" y="250" width="800" height="370" rx="10" fill="#e8f5e9" stroke="#34a853" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34a853">☁️ GOOGLE CLOUD PLATFORM</text>
  
  <!-- Cloud Run API -->
  <rect x="80" y="295" width="750" height="90" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="455" y="320" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Cloud Run (API Layer)</text>
  
  <!-- API Components -->
  <rect x="100" y="335" width="180" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="190" y="360" font-family="Arial, sans-serif" font-size="11" fill="#1e8e3e" text-anchor="middle" font-weight="bold">Vision Handler</text>
  
  <rect x="300" y="335" width="180" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="390" y="360" font-family="Arial, sans-serif" font-size="11" fill="#1e8e3e" text-anchor="middle" font-weight="bold">Image → Text Processing</text>
  
  <rect x="500" y="335" width="180" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="590" y="360" font-family="Arial, sans-serif" font-size="11" fill="#1e8e3e" text-anchor="middle" font-weight="bold">Conversation Orchestrator</text>
  
  <rect x="700" y="335" width="110" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="755" y="360" font-family="Arial, sans-serif" font-size="11" fill="#1e8e3e" text-anchor="middle" font-weight="bold">Context Mgmt</text>
  
  <!-- AI Services Row -->
  <rect x="80" y="410" width="360" height="90" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="260" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">🎙️ ElevenLabs Conversational AI 2.0</text>
  <text x="260" y="455" font-family="Arial, sans-serif" font-size="10" fill="#e8d5f0" text-anchor="middle">• Speech-to-Text (STT)</text>
  <text x="260" y="470" font-family="Arial, sans-serif" font-size="10" fill="#e8d5f0" text-anchor="middle">• LLM Processing</text>
  <text x="260" y="485" font-family="Arial, sans-serif" font-size="10" fill="#e8d5f0" text-anchor="middle">• Text-to-Speech (TTS) • Natural Turn-taking</text>
  
  <rect x="460" y="410" width="370" height="90" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="645" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">👁️ Vertex AI (Gemini 1.5 Pro Vision)</text>
  <text x="645" y="455" font-family="Arial, sans-serif" font-size="10" fill="#b3d4fc" text-anchor="middle">• Visual Analysis & Understanding</text>
  <text x="645" y="470" font-family="Arial, sans-serif" font-size="10" fill="#b3d4fc" text-anchor="middle">• OCR & Text Extraction</text>
  <text x="645" y="485" font-family="Arial, sans-serif" font-size="10" fill="#b3d4fc" text-anchor="middle">• Scene Description • Context Memory</text>
  
  <!-- Database Row -->
  <rect x="80" y="520" width="360" height="80" rx="8" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="260" y="550" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">🔥 Firestore</text>
  <text x="260" y="570" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">• User Preferences</text>
  <text x="260" y="585" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">• Conversation History</text>
  
  <rect x="460" y="520" width="370" height="80" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="645" y="550" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">📊 BigQuery</text>
  <text x="645" y="570" font-family="Arial, sans-serif" font-size="10" fill="#b8e6c4" text-anchor="middle">• Usage Analytics</text>
  <text x="645" y="585" font-family="Arial, sans-serif" font-size="10" fill="#b8e6c4" text-anchor="middle">• Performance Metrics</text>
  
  <!-- Connection lines between components -->
  <path d="M190 385 L190 410" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M590 385 L590 410" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M260 500 L260 520" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M645 500 L645 520" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Bidirectional arrow between ElevenLabs and Gemini -->
  <path d="M440 455 L460 455" stroke="white" stroke-width="2"/>
  <polygon points="440,455 448,451 448,459" fill="white"/>
  <polygon points="460,455 452,451 452,459" fill="white"/>
  
</svg>
